<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡检工作台 · RTRC</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#dce9ef;background:#101b25}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;background:#182b39;border-bottom:1px solid #314958;display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0}small,.muted{color:#9fb3bf}main{max-width:1200px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,input,select,textarea{font:inherit;border-radius:8px;border:1px solid #496170;padding:10px;background:#203746;color:#e6f4fa}button{cursor:pointer;touch-action:none}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:#167e76}button.danger{background:#b53737;color:white}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.card{background:#182b39;border:1px solid #314958;border-radius:12px;padding:18px;margin-bottom:14px}img{max-width:100%;border-radius:8px}#preview{width:100%;min-height:200px;background:#0c141c}h2{font-size:18px;margin:0 0 14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.badge{background:#284b5b;padding:5px 9px;border-radius:20px;font-size:13px}#message{position:sticky;top:0;background:#4b3c20;color:#ffedbe;padding:12px;display:none;z-index:5;white-space:pre-wrap}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.list img{width:100%;height:190px;object-fit:cover}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.pad button{min-height:58px;user-select:none}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}textarea{width:100%;margin:8px 0}label{display:block;margin:12px 0}a{color:#77dbcb}#login{max-width:420px;margin:55px auto}.hidden{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}header{padding:16px}main{padding:12px}h1{font-size:20px}}
</style>
<header><div><h1>巡检工作台</h1><small>RTRC 4PRO · 受控场地演示原型</small></div><span class="badge">指令时间轴路线</span></header>
<main><div id="message" role="alert"></div><section id="login" class="card"><h2>操作员登录</h2><form id="loginForm"><label>账号 <input name="username" value="operator" autocomplete="username" required></label><label>密码 <input name="password" type="password" autocomplete="current-password" required></label><button class="primary">进入工作台</button></form><p class="muted">手机与电脑连接同一热点，使用同一工作台地址。</p></section>
<section id="workspace" class="hidden"><nav><button data-tab="dashboard">现场巡检</button><button data-tab="events">异常与采样</button><button data-tab="tasks">处理任务</button><button id="logout">退出</button></nav>
<section id="dashboard"><div class="grid"><div><div class="card"><h2>摄像头实时预览</h2><img id="preview" alt="等待相机画面"><p id="cameraText" class="muted">正在连接…</p><div class="row"><button id="capture">保存现场照片</button><select id="checkpoint"><option value="">位置未确认</option><option>A</option><option>B</option><option>C</option></select><button id="setCheckpoint">确认当前检查点</button></div><p class="muted">检查点由操作员确认；不代表GPS坐标。绿化标注为颜色规则候选区域。</p><label><input type="checkbox" id="sampling"> 连续采样留证（约1张/秒）</label></div></div>
<div><div class="card"><h2>运动控制</h2><p class="muted">仅在车旁监护并确认停车条件后使用。默认锁定；网络中断需重新使能。软件停止不是实体急停。</p><div class="row"><button id="enable" class="primary">使能低速控制</button><button id="stop" class="danger">停止并锁定</button></div><div class="pad"><span></span><button data-drive="forward">按住前进</button><span></span><button data-drive="left">按住左转向</button><button data-drive="neutral">松开停止</button><button data-drive="right">按住右转向</button><span></span><button data-drive="back">按住后退</button></div><p id="controlText">未使能</p></div><div class="card"><h2>短路线录制 / 回放</h2><p class="muted">路线存在车端；回放由车端自行执行。可同时按住「前进」与左/右转向以录弯道。无硬件时为 dry-run（状态机演练，不发动力）。软件停止不是急停。</p><div class="row"><select id="routeSelect"><option value="">选择路线…</option></select><button id="routeRefresh">刷新列表</button></div><div class="row"><input id="routeName" placeholder="路线名称（可选）" style="min-width:160px"></div><div class="row"><button id="routeRecord" class="primary">开始录制</button><button id="routeRecordStop">结束录制并保存</button><button id="routePlay" class="primary">回放所选路线</button><button id="routeStop" class="danger">停止路线</button></div><p id="routeText" class="muted">路线：未连接</p></div><div class="card"><h2>设备与补传</h2><pre id="status">读取中…</pre></div></div></div></section>
<section id="events" class="hidden"><div class="row"><h2>异常与巡检采样</h2><button id="refreshEvents">刷新</button></div><div id="eventList" class="list"></div></section>
<section id="tasks" class="hidden"><div class="row"><h2>任务处理闭环</h2><button id="refreshTasks">刷新</button></div><div id="taskList" class="list"></div></section></section></main>
<script>
let csrf='',lease=null,seq=0,heldKeys=new Set(),busy=false,activeTab='dashboard',previewURL=null,routeMode='idle',routeDry=false;
const $=s=>document.querySelector(s), names={litter_bottle:'疑似垃圾 · 瓶子',litter_cup:'疑似垃圾 · 杯子',vegetation_candidate:'绿化候选 · 颜色规则',obstacle:'距离障碍',manual_capture:'人工留证',inspection_sample:'巡检采样',pending_inference:'待识别采样'}, states={pending:'待处理',working:'处理中',review:'待复核',closed:'已关闭'};
function message(t){$('#message').textContent=t;$('#message').style.display='block'}
async function api(path,method='GET',body=null){let opt={method,headers:{'X-CSRF-Token':csrf},signal:AbortSignal.timeout(4000)};if(body instanceof FormData)opt.body=body;else if(body!==null){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}let r=await fetch(path,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function node(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(text,fn,cls){let b=node('button',text,cls);b.onclick=()=>Promise.resolve().then(fn).catch(e=>message(e.message));return b}
function photo(name){let i=node('img');i.src='/images/'+encodeURIComponent(name);i.loading='lazy';return i}
function locationText(x){return x?.source==='manual_checkpoint'?'人工检查点 '+x.checkpoint:'位置未确认'}
async function enter(){ $('#login').classList.add('hidden');$('#workspace').classList.remove('hidden');await updateStatus();}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target);let d=await api('/api/login','POST',Object.fromEntries(f));csrf=d.csrf;$('#message').style.display='none';await enter()}catch(e){message(e.message)}};
async function stop(){heldKeys.clear();lease=null;try{await api('/api/robot/control/stop','POST',{})}catch(e){message('停止请求未获确认；依赖车端心跳停车，请现场确认：'+e.message)}}
$('#logout').onclick=async()=>{await stop();await api('/api/logout','POST',{});location.reload()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{if(activeTab==='dashboard')await stop();activeTab=b.dataset.tab;['dashboard','events','tasks'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==activeTab));if(activeTab==='events')loadEvents();if(activeTab==='tasks')loadTasks()});
$('#stop').onclick=stop;
$('#enable').onclick=async()=>{try{let d=await api('/api/robot/control/enable','POST',{});lease=d.lease;seq=0;heldKeys.clear();message('已使能；可同时按住前进+左/右转向。禁止倒车。')}catch(e){message(e.message)}};
document.querySelectorAll('[data-drive]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();let dryPad=routeMode==='recording'&&routeDry;if(!lease&&!dryPad){message(routeMode==='recording'?'请先使能控制再录制':'请先使能控制');return}if(b.dataset.drive==='back'){message('已禁止倒车（无后向测距）');return}if(b.dataset.drive==='neutral'){heldKeys.clear();return}b.setPointerCapture(e.pointerId);heldKeys.add(b.dataset.drive)};b.onpointerup=()=>{heldKeys.delete(b.dataset.drive)};b.onpointercancel=()=>{heldKeys.clear();if(lease)stop()};b.onlostpointercapture=()=>heldKeys.delete(b.dataset.drive)});
window.addEventListener('blur',()=>{if(lease)stop()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&lease)stop()});
window.addEventListener('pagehide',()=>{heldKeys.clear();if(lease)fetch('/api/robot/control/stop',{method:'POST',headers:{'X-CSRF-Token':csrf,'Content-Type':'application/json'},body:'{}',keepalive:true});lease=null});
setInterval(async()=>{let dryPad=routeMode==='recording'&&routeDry;if((!lease&&!dryPad)||busy)return;busy=true;let duty=heldKeys.has('forward')?0.15:0,steering=heldKeys.has('left')?-300:heldKeys.has('right')?300:0;try{if(dryPad){await api('/api/robot/routes/record/note','POST',{duty,steering})}else{await api('/api/robot/control/heartbeat','POST',{lease,seq:++seq,duty,steering})}}catch(e){if(!dryPad){lease=null;heldKeys.clear();message('控制连接失效，请确认小车停止后重新使能。'+e.message)}else{message('录制采样失败：'+e.message)}}finally{busy=false}},100);
$('#capture').onclick=async()=>{try{await api('/api/robot/capture','POST',{});message('采集请求已接受；请在异常与采样页查看落盘及上传结果。')}catch(e){message(e.message)}};
$('#setCheckpoint').onclick=async()=>{try{await api('/api/robot/checkpoint','POST',{checkpoint:$('#checkpoint').value||null});message('当前检查点已更新')}catch(e){message(e.message)}};
$('#sampling').onchange=async e=>{try{await api('/api/robot/sampling','POST',{enabled:e.target.checked})}catch(err){e.target.checked=!e.target.checked;message(err.message)}};
async function updateStatus(){if(!csrf)return;try{let s=await api('/api/robot/status');$('#cameraText').textContent='采集时间：'+(s.frame_at?new Date(s.frame_at).toLocaleString():'尚无画面')+(s.camera_error?' · '+s.camera_error:'');$('#controlText').textContent=(s.control.enabled?'已使能':'已锁定')+' · '+(s.control.reason||'心跳正常');$('#enable').disabled=!s.control.hardware_enabled||!s.control.transport_ok;$('#status').textContent=JSON.stringify({识别:s.model_loaded?'模型已加载':'模型未就绪',识别错误:s.inference_error,本地队列:s.queue,上传错误:s.upload_error,最后上传:s.last_upload,位置:s.location,测距:s.ranges,测距状态:s.range_error,障碍停车:s.control.obstacle_protection?'已配置':'未映射前方传感器，未启用',路线:s.route_mode,路线详情:s.route},null,2);if(!s.control.enabled){lease=null;heldKeys.clear()}if(s.route)refreshRoutes(s.route)}catch(e){$('#status').textContent='小车连接失败：'+e.message;lease=null;heldKeys.clear();$('#routeText').textContent='路线：小车离线'}}
async function preview(){if(!csrf||activeTab!=='dashboard'||document.hidden)return;try{let r=await fetch('/api/robot/preview',{signal:AbortSignal.timeout(3000)});if(!r.ok)return;let u=URL.createObjectURL(await r.blob());$('#preview').src=u;if(previewURL)URL.revokeObjectURL(previewURL);previewURL=u}catch(e){}}
async function loadEvents(){try{let rows=await api('/api/events'),target=$('#eventList');target.replaceChildren();if(!rows.length)target.append(node('p','尚无上传事件'));for(let e of rows){let c=node('article',undefined,'card');c.append(photo(e.image),node('h2',names[e.category]||e.category),node('p',new Date(e.captured_at).toLocaleString()),node('p',locationText(e.location)),node('p','识别：'+e.inference_state+' · '+(e.model_version||'未知版本'),'muted'),button('创建处理任务',async()=>{await api('/api/tasks','POST',{event_id:e.event_id});message('任务已创建，可在手机任务页处理')}));target.append(c)}}catch(e){message(e.message)}}
async function loadTasks(){try{let rows=await api('/api/tasks'),target=$('#taskList');target.replaceChildren();if(!rows.length)target.append(node('p','尚无任务'));for(let t of rows){let c=node('article',undefined,'card');c.append(photo(t.image),node('h2',names[t.event.category]||t.event.category),node('span',states[t.state],'badge'),node('p',locationText(t.event.location)));let action=async(a,body=new FormData())=>{await api('/api/tasks/'+t.id+'/'+a,'POST',body);await loadTasks();message('操作已保存')};if(t.state==='pending')c.append(button('接单处理',()=>action('claim'),'primary'));if(t.state==='working'){let text=node('textarea');text.placeholder='填写处理说明';let file=node('input');file.type='file';file.accept='image/*';c.append(text,file,button('提交处理结果',async()=>{let f=new FormData();f.set('note',text.value);if(file.files[0])f.set('photo',file.files[0]);await action('submit',f)},'primary'))}if(t.result_image)c.append(node('p',t.note),photo(t.result_image));if(t.state==='review')c.append(button('复核通过并关闭',()=>action('close'),'primary'),button('退回处理',()=>action('return')));target.append(c)}}catch(e){message(e.message)}}
$('#refreshEvents').onclick=loadEvents;$('#refreshTasks').onclick=loadTasks;
async function refreshRoutes(s){let st=s||null;if(!st){try{st=await api('/api/robot/routes/status')}catch(e){$('#routeText').textContent='路线：'+e.message;return}}let sel=$('#routeSelect'),cur=sel.value;sel.replaceChildren(node('option','选择路线…'));(st.routes||[]).forEach(r=>{let o=node('option',r.name+'（'+r.id+' · '+Number(r.duration_s).toFixed(1)+'s）');o.value=r.id;sel.append(o)});if([...sel.options].some(o=>o.value===cur))sel.value=cur;routeMode=st.mode||'idle';routeDry=!!st.dry_run;let hw=!!st.hardware_enabled;$('#routeRecord').disabled=st.mode!=='idle';$('#routeRecordStop').disabled=st.mode!=='recording';$('#routePlay').disabled=st.mode!=='idle'||!sel.value;$('#routeStop').disabled=st.mode==='idle';let tip=hw?'':' · 无硬件 dry-run';if(st.dry_run)tip+=' · dry-run';$('#routeText').textContent='模式：'+st.mode+(st.route_id?' · '+st.route_id:'')+(st.sample_count!=null&&st.mode==='recording'?' · 样本'+st.sample_count:'')+(st.error?' · '+st.error:'')+tip}
$('#routeRefresh').onclick=()=>refreshRoutes().catch(e=>message(e.message));
$('#routeSelect').onchange=()=>refreshRoutes().catch(()=>{});
$('#routeRecord').onclick=async()=>{try{let name=($('#routeName').value||'').trim()||'现场录制';let d=await api('/api/robot/routes/record/start','POST',{name});message(d.dry_run?'已开始 dry-run 录制：用方向键采样（无需使能），结束后保存':'已开始录制：请使能后按住前进（可同时按转向），结束后点「结束录制」');await refreshRoutes()}catch(e){message(e.message)}};
$('#routeRecordStop').onclick=async()=>{try{let d=await api('/api/robot/routes/record/stop','POST',{});message('路线已保存：'+(d.route_id||''));await refreshRoutes()}catch(e){message(e.message)}};
$('#routePlay').onclick=async()=>{try{let id=$('#routeSelect').value;if(!id){message('请先选择路线');return}let d=await api('/api/robot/routes/play','POST',{route_id:id});message(d.dry_run?'dry-run 回放中（无动力）':'已请求回放；请现场监护');await refreshRoutes()}catch(e){message(e.message)}};
$('#routeStop').onclick=async()=>{try{await api('/api/robot/routes/stop','POST',{});lease=null;heldKeys.clear();message('路线已停止');await refreshRoutes()}catch(e){message(e.message)}};
setInterval(updateStatus,2000);setInterval(preview,1000);api('/api/session').then(d=>{csrf=d.csrf;enter()}).catch(()=>{});
</script></html>
